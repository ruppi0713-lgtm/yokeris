<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ヨケリス</title>
  <link rel="stylesheet" href="game.css">
  <script src="board-view.js" defer></script>
  <script src="scenes.js" defer></script>
  <script src="game.js" defer></script>
</head>
<body>
  <main id="game" class="screen" aria-label="ヨケリスのゲーム画面" hidden>
    <header id="gameHeader">
      <h1><img src="yokeris-logo.png" alt="ヨケリス" width="554" height="174"></h1>
      <dl id="hud">
        <div><dt>SCORE</dt><dd id="sc">0</dd></div>
        <div><dt>LINE</dt><dd id="ln">0</dd></div>
        <div><dt>LV</dt><dd id="lv">1</dd></div>
        <div class="remaining"><dt>満腹まで</dt><dd><span id="left">20</span> マス</dd></div>
      </dl>
    </header>
    <div id="playfield">
      <div id="boardGroup">
        <canvas id="cv" width="600" height="1200" tabindex="-1" aria-label="酒ブロックの盤面"></canvas>
        <div class="gauge">
          <span class="gauge-label">胃残量</span>
          <div id="gaugeMeter" role="meter" aria-label="胃の使用量" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div id="gaugeFill"></div>
          </div>
          <span id="gaugePct">0%</span>
          <span id="gaugeWarn" hidden>危険!</span>
        </div>
      </div>
    </div>
    <footer id="controls">
      <p id="msg" role="status"></p>
      <div class="pad" role="group" aria-label="ブロックの操作">
        <button data-k="left" aria-label="左へ">←</button>
        <button data-k="rot">回転</button>
        <button data-k="right" aria-label="右へ">→</button>
        <button data-k="down">落下</button>
      </div>
      <div id="dpad" role="group" aria-label="ブロックの操作">
        <button class="up" data-k="rot" aria-label="回転">⟳</button>
        <button class="left" data-k="left" aria-label="左へ">←</button>
        <span class="mid" aria-hidden="true"></span>
        <button class="right" data-k="right" aria-label="右へ">→</button>
        <button class="down" data-k="down" aria-label="落下">↓</button>
      </div>
      <p class="keyHelp">← → 移動　↑ / Space 回転　↓ 落下</p>
    </footer>
  </main>

  <section id="opening" class="screen" data-stage="gate" aria-label="オープニングとタイトル">
    <video id="stageVideo" poster="opening-poster.jpg" playsinline webkit-playsinline preload="metadata" aria-hidden="true"></video>
    <div id="stageDim"></div>
    <img id="movieLogo" src="yokeris-logo.png" alt="" width="554" height="174" hidden>
    <button id="opGate" class="pixelButton">▶ 音ありでオープニングを見る</button>
    <button id="opSkip" class="sceneButton" hidden>スキップ ≫</button>
    <div id="menuScroll" hidden>
      <div id="menuPanel">
        <h1><img src="yokeris-logo.png" alt="ヨケリス" width="554" height="174"></h1>
        <p class="sub">酒ブロック積み上げ消し</p>
        <div class="menu">
          <button id="opStart" class="pixelButton">▶ ゲームスタート</button>
          <button id="opHow" class="pixelButton ghost" aria-controls="howPanel" aria-expanded="false">あそびかた</button>
          <button id="opSet" class="pixelButton ghost" aria-controls="setPanel" aria-expanded="false">セッティング</button>
        </div>
        <div class="panel" id="howPanel" hidden>
          <p>落ちてくる酒ブロックを横一列にそろえると「乾杯!!」</p>
          <p>← → で移動、↑ / Space で回転、↓ で速く落とせます。</p>
          <p>スマホでは右下の十字キーか、盤面のスワイプとタップで操作できます。</p>
          <p>天井まで積むとゲームオーバー。よっけの実写演出が流れます。</p>
        </div>
        <div class="panel" id="setPanel" hidden>
          <label>開始レベル
            <select id="setLevel">
              <option value="1">Lv.1 ゆっくり（初心者）</option>
              <option value="4">Lv.4 ふつう</option>
              <option value="7">Lv.7 はやい（上級者）</option>
            </select>
          </label>
          <label>音量（マスター） <span id="volVal">70%</span>
            <input type="range" id="setVol" min="0" max="100" value="70">
          </label>
          <label><input type="checkbox" id="setBgm" checked> BGMを流す</label>
          <label><input type="checkbox" id="setVideo" checked> ゲームオーバー動画演出を使う</label>
          <label><input type="checkbox" id="setFlash" checked> 消したときの「乾杯!!」表示</label>
          <button id="setBack" class="pixelButton ghost">とじる</button>
        </div>
      </div>
    </div>
  </section>

  <section id="over" class="screen" data-stage="movie" aria-label="ゲームオーバー" hidden>
    <video id="overVideo" src="yokke-gameover.mp4" preload="none" muted playsinline webkit-playsinline aria-label="よっけのゲームオーバー動画" hidden></video>
    <button id="overSkip" class="sceneButton">結果を見る ≫</button>
    <div id="overResult" hidden>
      <h1 id="overTitle">GAME OVER</h1>
      <p id="overScore"></p>
      <button id="again" class="pixelButton">もう一回遊ぶ</button>
    </div>
  </section>
</body>
</html>
